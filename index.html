<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LksAI - Netflix Clean</title>
    <!-- Custom Logo Font -->
    <link href="https://fonts.cdnfonts.com/css/ethnocentric" rel="stylesheet">
    <style>
        :root {
            --primary-color: #E50914;
            --primary-dark: #B20710;
            --bg-dark: #141414;
            --bg-sidebar: #000000;
            --bg-card: #2B2B2B;
            --bg-card-hover: #333333;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --border-color: #333333;
            --message-user-bg: #2B2B2B;
            --message-ai-bg: transparent;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
        }

        /* Custom Ethnocentric Logo Styles */
        .app-title {
            font-family: 'Ethnocentric Rg', sans-serif;
            font-size: clamp(16px, 2vw, 22px);
            font-weight: 500;
            letter-spacing: 4px;
            line-height: 1.25;
            text-transform: uppercase;
            text-align: left;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 16px;
            padding: 0;
            width: 100%;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--text-secondary);
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .chat-history h3 {
            padding: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-item {
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .chat-item.active {
            background: rgba(229, 9, 20, 0.1);
            color: var(--primary-color);
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
        }

        .settings-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: color 0.2s ease;
        }

        .settings-btn:hover {
            color: var(--text-primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .chat-header {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left h2 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .model-selector select {
            padding: 8px 12px;
            background: var(--bg-sidebar);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        .messages-area {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-message {
            text-align: center;
            margin: auto;
            padding: 40px;
        }

        .welcome-message h1 {
            font-family: 'Ethnocentric Rg', sans-serif;
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--text-primary);
            letter-spacing: 4px;
        }

        .welcome-message p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .message {
            display: flex;
            gap: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 80%;
            padding: 14px 20px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: var(--message-user-bg);
            border-radius: 12px 12px 2px 12px;
        }

        .message.ai .message-content {
            background: var(--message-ai-bg);
            color: var(--text-primary);
        }

        .message-icon {
            width: 34px;
            height: 34px;
            border-radius: 4px;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message-content code {
            background-color: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #ff6b6b;
        }

        .message-content pre {
            background-color: var(--bg-sidebar);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border-color);
        }

        /* Streaming Cursor */
        .streaming-cursor::after {
            content: '▋';
            display: inline-block;
            animation: blink 1s step-start infinite;
            color: var(--text-secondary);
            margin-left: 2px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Input Area */
        .input-area {
            padding: 20px 40px 30px;
            background: linear-gradient(transparent, var(--bg-dark) 20%);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            transition: border-color 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--text-secondary);
        }

        .message-input {
            flex: 1;
            background-color: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            max-height: 200px;
            font-size: 15px;
            outline: none;
            padding: 8px 0;
        }

        .message-input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            align-self: flex-end;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .send-btn:disabled {
            background: var(--bg-card-hover);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .slider {
            width: 100%;
            accent-color: var(--primary-color);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            z-index: 2000;
            transition: bottom 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .toast.show {
            bottom: 20px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; padding: 10px 20px;}
            .sidebar-header { padding: 0; flex: 1; display: flex; align-items: center; gap: 15px;}
            .app-title { margin-bottom: 0; font-size: 14px;}
            .new-chat-btn { width: auto; padding: 6px 12px;}
            .chat-history, .sidebar-footer { display: none; }
            .input-area { padding: 15px; }
            .messages-container { padding: 20px; }
            .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">LksAI</h1>
                <button class="new-chat-btn" onclick="startNewChat()">
                    <span>+</span> New Chat
                </button>
            </div>

            <div class="chat-history">
                <h3>Recent Chats</h3>
                <div id="chatList" class="chat-list"></div>
            </div>

            <div class="sidebar-footer">
                <button class="settings-btn" onclick="toggleSettings()">
                    ⚙️ Settings
                </button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <div class="header-left">
                    <h2 id="chatTitle">New Chat</h2>
                </div>
                <div class="header-right">
                    <div class="model-selector">
                        <select id="modelSelect" onchange="changeModel()">
                            <option value="openai/gpt-4o">GPT-4 Omni</option>
                            <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                            <option value="deepseek/deepseek-chat">DeepSeek Chat</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Messages Area -->
            <div class="messages-container">
                <div id="messagesArea" class="messages-area">
                    <div class="welcome-message">
                        <h1>LksAI</h1>
                        <p>What do you want to explore today?</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="messageInput" class="message-input" placeholder="Message LksAI..." rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="toggleSettings()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>Temperature (<span id="temperatureValue">0.7</span>)</label>
                    <input type="range" id="temperatureSlider" class="slider" min="0" max="1" step="0.1" value="0.7" onchange="updateTemperature()">
                </div>
                <div class="setting-group">
                    <label>Context Memory (<span id="contextValue">5</span> messages)</label>
                    <input type="range" id="contextWindowSlider" class="slider" min="1" max="10" step="1" value="5" onchange="updateContextWindow()">
                </div>
                <button class="btn-primary" onclick="clearChatHistory()">Clear Chat History</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const state = {
            currentModel: 'openai/gpt-4o',
            temperature: parseFloat(localStorage.getItem('lksai_temperature') || '0.7'),
            contextWindow: parseInt(localStorage.getItem('lksai_context_window') || '5'),
            messages: [],
            chatHistory: JSON.parse(localStorage.getItem('lksai_chat_history') || '[]'),
            currentChatId: null,
            isLoading: false,
            apiKey: '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'
        };

        const OPENROUTER_API_URL = 'https://openrouter.ai/api/v1/chat/completions';

        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            loadSettingsFromStorage();
            renderChatHistory();
            setupTextareaAutoResize();
        });

        function setupEventListeners() {
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.getElementById('modelSelect').addEventListener('change', (e) => {
                state.currentModel = e.target.value;
                localStorage.setItem('lksai_model', state.currentModel);
            });
        }

        function setupTextareaAutoResize() {
            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
            });
        }

        function loadSettingsFromStorage() {
            const savedModel = localStorage.getItem('lksai_model') || 'openai/gpt-4o';
            state.currentModel = savedModel;
            document.getElementById('modelSelect').value = savedModel;
            document.getElementById('temperatureSlider').value = state.temperature;
            document.getElementById('temperatureValue').textContent = state.temperature;
            document.getElementById('contextWindowSlider').value = state.contextWindow;
            document.getElementById('contextValue').textContent = state.contextWindow;
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message || state.isLoading) return;

            state.messages.push({ role: 'user', content: message });
            renderMessages();
            messageInput.value = '';
            messageInput.style.height = 'auto';

            if (!state.currentChatId) {
                state.currentChatId = Date.now().toString();
                state.chatHistory.unshift({
                    id: state.currentChatId,
                    title: message.substring(0, 30) + (message.length > 30 ? '...' : ''),
                    messages: state.messages
                });
                renderChatHistory();
            }

            state.isLoading = true;
            document.querySelector('.send-btn').disabled = true;

            try {
                const response = await fetch(OPENROUTER_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.apiKey}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'LksAI',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: state.currentModel,
                        messages: state.messages.slice(-state.contextWindow * 2),
                        temperature: state.temperature,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errJson = await response.json().catch(() => ({}));
                    throw new Error(errJson.error?.message || `API Error: ${response.status}`);
                }

                await handleStreamedResponse(response);
                updateChatHistory();
            } catch (error) {
                showToast(`Error: ${error.message}`);
                state.messages.pop();
                renderMessages();
            } finally {
                state.isLoading = false;
                document.querySelector('.send-btn').disabled = false;
                messageInput.focus();
            }
        }

        async function handleStreamedResponse(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let assistantMessage = '';
            let messageAdded = false;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const json = JSON.parse(line.slice(6));
                            const content = json.choices?.[0]?.delta?.content || '';
                            assistantMessage += content;

                            if (!messageAdded) {
                                state.messages.push({ role: 'assistant', content: '' });
                                messageAdded = true;
                            }

                            state.messages[state.messages.length - 1].content = assistantMessage;
                            renderMessages(true);
                        } catch (e) {}
                    }
                }
            }
            renderMessages(false);
        }

        function renderMessages(isStreaming = false) {
            const messagesArea = document.getElementById('messagesArea');
            
            if (state.messages.length === 0) {
                messagesArea.innerHTML = `
                    <div class="welcome-message">
                        <h1>LksAI</h1>
                        <p>What do you want to explore today?</p>
                    </div>`;
                return;
            }

            messagesArea.innerHTML = '';
            
            state.messages.forEach((msg, index) => {
                const isLastAiMessage = isStreaming && index === state.messages.length - 1 && msg.role === 'assistant';
                const messageEl = document.createElement('div');
                messageEl.className = `message ${msg.role}`;

                if (msg.role === 'assistant') {
                    messageEl.innerHTML = `
                        <div class="message-icon">L</div>
                        <div class="message-content ${isLastAiMessage ? 'streaming-cursor' : ''}">${formatMessage(msg.content)}</div>
                    `;
                } else {
                    messageEl.innerHTML = `
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                    `;
                }

                messagesArea.appendChild(messageEl);
            });

            const container = document.querySelector('.messages-container');
            container.scrollTop = container.scrollHeight;
        }

        function formatMessage(content) {
            let formatted = escapeHtml(content);
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            formatted = formatted.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });
            return formatted;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function startNewChat() {
            state.messages = [];
            state.currentChatId = null;
            document.getElementById('chatTitle').textContent = 'New Chat';
            renderMessages();
            document.getElementById('messageInput').focus();
        }

        function renderChatHistory() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';
            
            state.chatHistory.forEach(chat => {
                const btn = document.createElement('button');
                btn.className = `chat-item ${chat.id === state.currentChatId ? 'active' : ''}`;
                btn.textContent = chat.title;
                btn.onclick = () => {
                    state.currentChatId = chat.id;
                    state.messages = chat.messages || [];
                    document.getElementById('chatTitle').textContent = chat.title;
                    renderMessages();
                    renderChatHistory();
                };
                chatList.appendChild(btn);
            });
        }

        function updateChatHistory() {
            if (state.currentChatId) {
                const chat = state.chatHistory.find(c => c.id === state.currentChatId);
                if (chat) {
                    chat.messages = state.messages;
                    localStorage.setItem('lksai_chat_history', JSON.stringify(state.chatHistory));
                }
            }
        }

        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('active');
        }

        function updateTemperature() {
            state.temperature = parseFloat(document.getElementById('temperatureSlider').value);
            document.getElementById('temperatureValue').textContent = state.temperature;
            localStorage.setItem('lksai_temperature', state.temperature);
        }

        function updateContextWindow() {
            state.contextWindow = parseInt(document.getElementById('contextWindowSlider').value);
            document.getElementById('contextValue').textContent = state.contextWindow;
            localStorage.setItem('lksai_context_window', state.contextWindow);
        }

        function clearChatHistory() {
            if (confirm('Clear all history?')) {
                state.chatHistory = [];
                state.messages = [];
                state.currentChatId = null;
                localStorage.removeItem('lksai_chat_history');
                renderChatHistory();
                renderMessages();
                toggleSettings();
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.addEventListener('click', (e) => {
            const modal = document.getElementById('settingsModal');
            if (e.target === modal) modal.classList.remove('active');
        });
    </script>
</body>
</html>
